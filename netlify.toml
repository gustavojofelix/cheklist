# Netlify build for the Angular SPA. The same repository serves several Netlify sites:
#   dev/staging site  → no variables needed (falls back to the dev Supabase project)
#   production site   → set APP_ENV=production, SUPABASE_URL, SUPABASE_ANON_KEY in Site settings → Environment variables
# Security and cache headers are generated per site into _headers (scripts/write-headers.mjs).
[build]
  command = "npm ci && npm run build:netlify"
  publish = "dist/checklist-legal/browser"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA: every route is served by index.html (Angular router handles it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
